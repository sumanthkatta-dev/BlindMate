<!DOCTYPE html>
<html lang="en">

<head>
  <title>Path Buddy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <style>
    /* --- Reset and Base Styles --- */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.15), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(30, 58, 138, 0.15), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      width: 100%;
      max-width: 850px;
      text-align: center;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      color: #1e40af;
      font-size: 32px;
      font-weight: 800;
      border-radius: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      margin-bottom: 25px;
      position: relative;
      z-index: 1;
      letter-spacing: -0.5px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    header:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
    }

    /* --- FPS Display --- */
    #fps {
      margin: 15px 0;
      font-weight: 700;
      color: #ffffff;
      font-size: 15px;
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.95), rgba(37, 99, 235, 0.95));
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.3) inset;
      display: none;
      position: relative;
      z-index: 1;
      transition: all 0.3s ease;
    }

    #fps:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    /* --- Main Container --- */
    .main-container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      position: relative;
      z-index: 1;
    }

    /* --- Camera Container --- */
    .camera-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      padding: 20px;
      position: relative;
      overflow: hidden;
      aspect-ratio: 4/3;
      display: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .camera-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    video,
    canvas {
      position: absolute;
      top: 20px;
      left: 20px;
      width: calc(100% - 40px);
      height: calc(100% - 40px);
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1) inset;
    }

    #warning {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      display: none;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: pulse 1s infinite;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      padding: 15px 30px;
      border-radius: 30px;
      box-shadow: 0 8px 25px rgba(231, 76, 60, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.8) inset;
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    @keyframes pulse {
      0% {
        transform: translateX(-50%) scale(1);
        opacity: 1;
      }

      50% {
        transform: translateX(-50%) scale(1.05);
        opacity: 0.8;
      }

      100% {
        transform: translateX(-50%) scale(1);
        opacity: 1;
      }
    }

    /* --- Info Panel --- */
    .info-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      transition: transform 0.3s ease;
    }

    .info-panel:hover {
      transform: translateY(-3px);
    }

    .info-panel::-webkit-scrollbar {
      width: 8px;
    }

    .info-panel::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
    }

    .info-panel::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      border-radius: 10px;
    }

    .info-panel::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #2563eb, #1e40af);
    }

    .detection-item {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      margin: 10px 0;
      border-radius: 15px;
      color: white;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      position: relative;
      overflow: hidden;
    }

    .detection-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .detection-item:hover::before {
      left: 100%;
    }

    .detection-item:hover {
      transform: translateX(5px) scale(1.02);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .high {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
    }

    .medium {
      background: linear-gradient(135deg, #f39c12, #e67e22);
    }

    .low {
      background: linear-gradient(135deg, #27ae60, #229954);
    }

    .detection-item i {
      margin-right: 10px;
      font-size: 16px;
    }

    /* --- Navigation Section --- */
    .navigation-section {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: transform 0.3s ease;
    }

    .navigation-section:hover {
      transform: translateY(-5px);
    }

    .nav-header {
      text-align: center;
      background: linear-gradient(135deg, #1e40af, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 5px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .map-weather-container {
      display: flex;
      gap: 15px;
    }

    .map-wrapper {
      flex: 1;
    }

    #map {
      height: 400px;
      width: 100%;
      border-radius: 20px;
      border: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(37, 99, 235, 0.3) inset;
      overflow: hidden;
    }

    .weather-wrapper {
      width: 250px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(240, 242, 245, 0.9));
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      border: none;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      transition: transform 0.3s ease;
    }

    .weather-wrapper:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
    }

    .weather-wrapper h4 {
      margin: 0 0 15px 0;
      background: linear-gradient(135deg, #1e40af, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
    }

    .weather-details {
      font-size: 14px;
      color: #2c3e50;
    }

    .weather-details p {
      margin: 5px 0;
    }

    #destination {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid rgba(37, 99, 235, 0.2);
      border-radius: 15px;
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #destination:focus {
      outline: none;
      border-color: #2563eb;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1), 0 8px 20px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    #destination::placeholder {
      color: rgba(0, 0, 0, 0.4);
    }

    .nav-controls {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
      gap: 10px;
    }

    .nav-controls button {
      padding: 15px 30px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: white;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.3);
      position: relative;
      overflow: hidden;
    }

    .nav-controls button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .nav-controls button:hover::before {
      width: 300px;
      height: 300px;
    }

    .nav-controls button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(30, 64, 175, 0.4);
    }

    .nav-controls button:active {
      transform: translateY(-1px);
    }

    .nav-controls button.stop {
      background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    }

    .nav-controls button.stop:hover {
      box-shadow: 0 12px 30px rgba(255, 107, 107, 0.5);
    }

    #startNavBtn,
    #stopNavBtn {
      display: none;
    }

    #remaining {
      text-align: center;
      font-weight: 600;
      color: #1e40af;
      margin-bottom: 10px;
      font-size: 16px;
    }

    #directions {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(240, 242, 245, 0.8));
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      max-height: 250px;
      overflow-y: auto;
      font-size: 14px;
      color: #2c3e50;
      border: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1) inset;
    }

    #directions::-webkit-scrollbar {
      width: 8px;
    }

    #directions::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
    }

    #directions::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      border-radius: 10px;
    }

    #directions ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #directions li {
      margin-bottom: 12px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-left: 3px solid transparent;
    }

    #directions li:hover {
      transform: translateX(8px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      border-left-color: #2563eb;
    }

    #directions li.current {
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.2), rgba(37, 99, 235, 0.2));
      border: 2px solid #2563eb;
      border-left: 4px solid #2563eb;
      font-weight: 800;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.2);
    }

    #directions li::before {
      content: '\f277';
      font-family: 'Font Awesome 5 Free';
      margin-right: 10px;
      color: #2563eb;
      font-weight: 900;
      font-size: 14px;
    }

    /* --- Control Panel --- */
    .control-panel {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      display: none;
    }

    .control-panel button {
      padding: 15px 28px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: white;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.3);
    }

    .control-panel button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 30px rgba(30, 64, 175, 0.4);
    }

    .control-panel button:active {
      transform: translateY(-1px) scale(0.98);
    }

    /* --- Footer --- */
    footer {
      margin-top: auto;
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      padding: 30px 0;
      position: relative;
      z-index: 1;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    /* --- Responsive Design --- */
    @media (max-width: 768px) {
      header {
        font-size: 24px;
        padding: 15px 0;
      }

      .camera-container {
        aspect-ratio: auto;
        height: 300px;
        padding: 10px;
      }

      #warning {
        font-size: 20px;
        padding: 8px 16px;
      }

      #map {
        height: 250px;
      }

      .info-panel {
        max-height: 200px;
      }

      .control-panel {
        gap: 10px;
      }

      .control-panel button {
        padding: 10px 16px;
        font-size: 14px;
      }

      .nav-controls button {
        padding: 10px 20px;
      }

      .nav-controls {
        flex-direction: column;
      }

      .map-weather-container {
        flex-direction: column;
      }

      .weather-wrapper {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 5px;
      }

      header {
        font-size: 20px;
      }

      .main-container {
        gap: 15px;
      }

      #fps {
        font-size: 14px;
        padding: 6px 12px;
      }
    }
  </style>
</head>

<body>
  <header><i class="fas fa-shield-alt" style="margin-right: 10px;"></i> Path Buddy</header>
  <div id="fps">FPS: 0</div>

  <div class="main-container">
    <div class="camera-container" id="cameraContainer">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
      <div id="warning"><i class="fas fa-exclamation-triangle" style="margin-right: 5px;"></i> HIGH-RISK OBJECT NEARBY!
      </div>
    </div>

    <div class="info-panel" id="infoPanel">
      <p style="text-align:center; color:#bdc3c7;">Detections will appear here...</p>
    </div>

    <div class="navigation-section">
      <div class="nav-header"><i class="fas fa-map-marked-alt" style="margin-right: 10px;"></i> Navigation</div>
      <div class="map-weather-container">
        <div class="map-wrapper">
          <div id="map"></div>
        </div>
        <div class="weather-wrapper">
          <h4><i class="fas fa-cloud-sun"></i> Weather</h4>
          <div id="weather-details" class="weather-details">Loading...</div>
        </div>
      </div>
      <input type="text" id="destination" placeholder="Enter destination (e.g., Eiffel Tower, Paris)">
      <div class="nav-controls">
        <button onclick="askForMode()"><i class="fas fa-microphone" style="margin-right: 5px;"></i> Voice
          Destination</button>
        <button onclick="getDirections()"><i class="fas fa-route" style="margin-right: 5px;"></i> Get
          Directions</button>
        <button id="startNavBtn" onclick="startNavigation()"><i class="fas fa-play" style="margin-right: 5px;"></i>
          Start Navigation</button>
        <button id="stopNavBtn" class="stop" onclick="stopNavigation()"><i class="fas fa-stop"
            style="margin-right: 5px;"></i> Stop Navigation</button>
      </div>
      <div id="remaining">Remaining distance: -- km</div>
      <div id="directions">
        <p style="text-align:center; color:#bdc3c7;">Directions will appear here...</p>
      </div>
    </div>

    <div class="control-panel" id="controlPanel">
      <button onclick="toggleTTS()"><i class="fas fa-volume-up" style="margin-right: 5px;"></i> Toggle TTS</button>
      <button onclick="toggleBeep()"><i class="fas fa-bell" style="margin-right: 5px;"></i> Toggle Beep</button>
    </div>
  </div>

  <footer>&copy;  Sumanth Katta | YOLO Safety Mode v1.5</footer>

  <!-- Define initMap globally before loading the API -->
  <script>
    let map, directionsService, directionsRenderer;
    let currentPosMarker;
    let ttsEnabled = true, beepEnabled = true;
    let isNavigating = false;
    let currentRoute;
    let currentStepIndex = 0;
    let watchId;
    let detectionInterval;
    let videoStream;
    let weatherFetched = false;
    let recognition;

    const OPENWEATHER_API_KEY = '226cdf438d97c9d0f81995410463446e';
    const GOOGLE_API_KEY = 'AIzaSyAXBwgALGVtu7BtUG9e0YwxzoJo3diqJPo';

    function initRecognition() {
      recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
    }

    initRecognition();

    function askForMode() {
      if (ttsEnabled) {
        const synth = window.speechSynthesis;
        const utterance = new SpeechSynthesisUtterance("Do you want roaming or casual walk, or destination?");
        utterance.onend = () => {
          startListeningForMode();
        };
        synth.speak(utterance);
      } else {
        startListeningForMode();
      }
    }

    function startListeningForMode() {
      recognition.onresult = (event) => {
        const mode = event.results[0][0].transcript.toLowerCase();
        if (mode.includes('walk') || mode.includes('roaming') || mode.includes('casual')) {
          // Start casual walk mode: open camera detection only
          startDetection();
        } else if (mode.includes('destination')) {
          // Destination mode: ask for destination
          askForDestination();
        } else {
          // Default or retry
          alert('Invalid mode. Please try again.');
          askForMode();
        }
      };
      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        alert('Speech recognition error. Please try again.');
      };
      recognition.start();
    }

    function askForDestination() {
      if (ttsEnabled) {
        const synth = window.speechSynthesis;
        const utterance = new SpeechSynthesisUtterance("Please speak your destination.");
        utterance.onend = () => {
          startListeningForDestination();
        };
        synth.speak(utterance);
      } else {
        startListeningForDestination();
      }
    }

    function startListeningForDestination() {
      recognition.onresult = (event) => {
        const destination = event.results[0][0].transcript;
        document.getElementById('destination').value = destination;
        getDirections().then(() => {
          startNavigation();
        }).catch(err => {
          console.error('Error starting navigation:', err);
        });
      };
      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        alert('Speech recognition error. Please try again.');
      };
      recognition.start();
    }

    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), {
        zoom: 15,
        center: { lat: 0, lng: 0 },
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        styles: [
          {
            featureType: "poi",
            elementType: "labels",
            stylers: [{ visibility: "off" }]
          }
        ]
      });

      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({
        map: map,
        suppressMarkers: false,
        polylineOptions: {
          strokeColor: '#2563eb',
          strokeWeight: 5
        }
      });

      // Initial position watch
      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(updatePosition, (err) => {
          console.error('Geolocation error:', err);
          // Default to a location if geolocation fails
          const defaultPos = { lat: 37.7749, lng: -122.4194 }; // San Francisco
          map.setCenter(defaultPos);
          if (currentPosMarker) {
            currentPosMarker.setPosition(defaultPos);
          } else {
            currentPosMarker = new google.maps.Marker({
              position: defaultPos,
              map: map,
              title: 'Default Location (Geolocation failed)'
            });
          }
          alert('Geolocation failed. Using default location. Please enable location permissions.');
        }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });

        // Trigger initial position to fetch weather immediately
        navigator.geolocation.getCurrentPosition(updatePosition);
      } else {
        alert('Geolocation not supported by this browser.');
      }
    }

    async function fetchWeather(lat, lng) {
      try {
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lng}&appid=${OPENWEATHER_API_KEY}&units=metric`);
        const data = await response.json();
        if (data.cod === 200) {
          const { name, main, weather, wind } = data;
          const description = weather[0].description;
          const temp = Math.round(main.temp);
          const feelsLike = Math.round(main.feels_like);
          const humidity = main.humidity;
          const windSpeed = wind.speed;

          const weatherHtml = `
            <p><strong>${name}</strong></p>
            <p>Temp: ${temp}°C</p>
            <p>Feels like: ${feelsLike}°C</p>
            <p>${description.charAt(0).toUpperCase() + description.slice(1)}</p>
            <p>Humidity: ${humidity}%</p>
            <p>Wind: ${windSpeed} m/s</p>
          `;
          document.getElementById('weather-details').innerHTML = weatherHtml;

          // Speak weather if TTS enabled
          if (ttsEnabled) {
            const message = `Current weather in ${name}: temperature ${temp} degrees Celsius, humidity ${humidity} percent.`;
            const synth = window.speechSynthesis;
            synth.cancel();
            const weatherUtterance = new SpeechSynthesisUtterance(message);
            weatherUtterance.onend = () => {
              askForDestination();
            };
            synth.speak(weatherUtterance);
          } else {
            askForDestination();
          }
        } else {
          document.getElementById('weather-details').innerHTML = 'Error fetching weather.';
          askForDestination();
        }
      } catch (err) {
        console.error('Weather fetch error:', err);
        document.getElementById('weather-details').innerHTML = 'Error fetching weather.';
        askForDestination();
      }
    }

    function updatePosition(pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const currentPos = new google.maps.LatLng(lat, lng);
      map.setCenter(currentPos);

      if (currentPosMarker) {
        currentPosMarker.setPosition(currentPos);
      } else {
        currentPosMarker = new google.maps.Marker({
          position: currentPos,
          map: map,
          title: 'Your Current Location',
          icon: {
            url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="%233498db"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>'),
            scaledSize: new google.maps.Size(30, 30)
          }
        });
      }

      // Fetch weather on first position update
      if (!weatherFetched) {
        fetchWeather(lat, lng);
        weatherFetched = true;
      }

      if (isNavigating && currentRoute) {
        const steps = currentRoute.routes[0].legs[0].steps;
        if (currentStepIndex < steps.length) {
          let step = steps[currentStepIndex];
          let distToStart = google.maps.geometry.spherical.computeDistanceBetween(currentPos, step.start_location);
          // Advance steps if close
          while (currentStepIndex < steps.length && distToStart < 50) { // 50 meters threshold
            speakInstruction(step.instructions);
            currentStepIndex++;
            if (currentStepIndex < steps.length) {
              step = steps[currentStepIndex];
              distToStart = google.maps.geometry.spherical.computeDistanceBetween(currentPos, step.start_location);
            } else {
              speakInstruction('You have arrived at your destination.');
              stopNavigation();
              return;
            }
          }
          // Highlight current step
          document.querySelectorAll('#directions li').forEach((li, idx) => {
            li.classList.toggle('current', idx === currentStepIndex);
          });
          // Update remaining distance
          const remainingDist = google.maps.geometry.spherical.computeDistanceBetween(currentPos, currentRoute.routes[0].legs[0].end_location);
          document.getElementById('remaining').innerHTML = `Remaining distance: ${Math.round(remainingDist / 1000)} km`;
        }
      }
    }

    function speakInstruction(text) {
      if (ttsEnabled) {
        const message = `${text}`;
        const synth = window.speechSynthesis;
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.rate = 0.9; // Slightly slower for clarity
        synth.speak(utterance);
      }
    }

    function startNavigation() {
      if (!currentRoute) {
        alert('Please get directions first.');
        return;
      }
      isNavigating = true;
      currentStepIndex = 0;
      document.getElementById('startNavBtn').style.display = 'none';
      document.getElementById('stopNavBtn').style.display = 'inline-block';
      speakInstruction('Navigation started. Follow the directions.');
      // Highlight first step
      document.querySelectorAll('#directions li')[0]?.classList.add('current');
      updatePosition({ coords: { latitude: currentPosMarker.getPosition().lat(), longitude: currentPosMarker.getPosition().lng() } });

      // Start camera and detection
      startDetection();
    }

    function stopNavigation() {
      isNavigating = false;
      document.getElementById('startNavBtn').style.display = 'inline-block';
      document.getElementById('stopNavBtn').style.display = 'none';
      document.getElementById('remaining').innerHTML = 'Remaining distance: -- km';
      document.querySelectorAll('#directions li').forEach(li => li.classList.remove('current'));
      const synth = window.speechSynthesis;
      synth.cancel();

      // Stop camera and detection
      stopDetection();
    }

    function startDetection() {
      document.getElementById('cameraContainer').style.display = 'block';
      document.getElementById('infoPanel').style.display = 'block';
      document.getElementById('controlPanel').style.display = 'flex';
      document.getElementById('fps').style.display = 'block';

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
          videoStream = stream;
          video.srcObject = stream;
          resizeCanvas();
          detectionInterval = setInterval(sendFrame, 33); // ~30 FPS
        })
        .catch(err => {
          alert("Error accessing camera: " + err);
        });
    }

    function stopDetection() {
      if (detectionInterval) {
        clearInterval(detectionInterval);
        detectionInterval = null;
      }
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
        video.srcObject = null;
      }
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      document.getElementById('cameraContainer').style.display = 'none';
      document.getElementById('infoPanel').style.display = 'none';
      document.getElementById('controlPanel').style.display = 'none';
      document.getElementById('fps').style.display = 'none';
    }

    async function getDirections() {
      const dest = document.getElementById('destination').value.trim();
      if (!dest) {
        alert('Please enter a destination.');
        return;
      }

      document.getElementById('directions').innerHTML = '<p>Loading directions...</p>';
      document.getElementById('remaining').innerHTML = 'Loading...';

      try {
        // Get current position
        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 60000
          });
        });
        const currentPos = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);

        const geocoder = new google.maps.Geocoder();
        const geocodePromise = new Promise((resolve, reject) => {
          geocoder.geocode({ address: dest }, (results, status) => {
            if (status === 'OK' && results[0]) {
              resolve(results[0].geometry.location);
            } else {
              reject(new Error('Geocode failed: ' + status));
            }
          });
        });

        const destPos = await geocodePromise;

        const request = {
          origin: currentPos,
          destination: destPos,
          travelMode: 'WALKING'  // Change to 'DRIVING' if needed
        };

        const directionsPromise = new Promise((resolve, reject) => {
          directionsService.route(request, (result, status) => {
            if (status === 'OK') {
              resolve(result);
            } else {
              reject(new Error('Directions request failed: ' + status));
            }
          });
        });

        currentRoute = await directionsPromise;
        directionsRenderer.setDirections(currentRoute);

        const steps = currentRoute.routes[0].legs[0].steps;
        let dirHtml = '<ul>';
        steps.forEach((step, index) => {
          const distance = Math.round(step.distance.value / 1000);
          dirHtml += `<li data-step="${index}">${step.instructions} <strong>(${distance} km)</strong></li>`;
        });
        dirHtml += '</ul>';
        document.getElementById('directions').innerHTML = dirHtml;

        // Show start button
        document.getElementById('startNavBtn').style.display = 'inline-block';

        // Initial remaining
        const remainingDist = google.maps.geometry.spherical.computeDistanceBetween(currentPos, currentRoute.routes[0].legs[0].end_location);
        document.getElementById('remaining').innerHTML = `Remaining distance: ${Math.round(remainingDist / 1000)} km`;

        // Optional: Speak the first direction if TTS enabled
        if (ttsEnabled && steps.length > 0) {
          speakInstruction(`Route loaded. ${steps[0].instructions}`);
        }

        // Fit map to directions
        map.fitBounds(directionsRenderer.getDirections().routes[0].bounds);

      } catch (err) {
        console.error('Error in getDirections:', err);
        alert('Error getting directions: ' + err.message + '. Please check your internet connection and location permissions.');
        document.getElementById('directions').innerHTML = '<p>Error loading directions. Try again.</p>';
        document.getElementById('remaining').innerHTML = 'Remaining distance: -- km';
      }
    }

    // YOLO Processing Script
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const infoPanel = document.getElementById('infoPanel');
    const fpsDisplay = document.getElementById('fps');
    const warningDiv = document.getElementById('warning');

    function toggleTTS() { ttsEnabled = !ttsEnabled; alert('TTS ' + (ttsEnabled ? 'Enabled' : 'Disabled')); }
    function toggleBeep() { beepEnabled = !beepEnabled; alert('Beep ' + (beepEnabled ? 'Enabled' : 'Disabled')); }

    let processing = false, lastTime = performance.now(), frameCount = 0;

    function getColorByDistance(distance) {
      switch (distance) {
        case "1 meter": return "#ff0000";
        case "about 2 meters": return "#ff8800";
        default: return "#27ae60";
      }
    }

    async function sendFrame() {
      if (processing || !video.srcObject) return;
      processing = true;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append("file", blob, "frame.jpg");

        try {
          const response = await fetch("http://127.0.0.1:8000/predict/", { method: "POST", body: formData });
          const data = await response.json();

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          infoPanel.innerHTML = "";

          if (data.detections.length > 0) {
            let highObj = null;
            let showWarning = false;

            data.detections.forEach(d => {
              const [x1, y1, x2, y2] = d.bbox;
              const color = getColorByDistance(d.distance);
              ctx.strokeStyle = color;
              ctx.lineWidth = d.risk.includes("High") ? 4 : 2;
              ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

              ctx.fillStyle = color;
              ctx.font = "14px Arial";
              ctx.fillText(`${d.label} | ${d.risk} | ${d.distance}`, x1, y1 - 5);

              const div = document.createElement("div");
              div.classList.add("detection-item");
              div.classList.add(d.risk.includes("High") ? "high" : d.risk.includes("Medium") ? "medium" : "low");

              let dirIcon = "";
              if (d.direction.includes("left")) dirIcon = "<i class='fas fa-arrow-left'></i>";
              else if (d.direction.includes("right")) dirIcon = "<i class='fas fa-arrow-right'></i>";
              else dirIcon = "<i class='fas fa-arrow-up'></i>";

              div.innerHTML = `${dirIcon} ${d.label} | ${d.risk} | ${d.distance} | ${d.direction}`;
              infoPanel.appendChild(div);

              if (d.risk.includes("High") && (!highObj || d.distance === "1 meter")) highObj = d;
              if (d.risk.includes("High") && d.distance === "1 meter") showWarning = true;
            });

            if (highObj && ttsEnabled) {
              const message = `${highObj.risk}: ${highObj.label}, ${highObj.direction}, ${highObj.distance}`;
              const synth = window.speechSynthesis;
              if (!synth.speaking) synth.speak(new SpeechSynthesisUtterance(message));
            }

            warningDiv.style.display = showWarning ? "block" : "none";
            if (showWarning && beepEnabled) {
              const audio = new Audio('https://www.soundjay.com/button/beep-07.wav');
              audio.play().catch(() => { });  // Ignore play errors
            }
          } else {
            infoPanel.innerHTML = "<p style='text-align:center; color:#bdc3c7;'>No detections...</p>";
          }

          frameCount++;
          const now = performance.now();
          if (now - lastTime > 1000) {
            fpsDisplay.innerText = `FPS: ${frameCount}`;
            frameCount = 0;
            lastTime = now;
          }

        } catch (err) {
          console.error("Backend request failed:", err);
        } finally {
          processing = false;
        }
      }, 'image/jpeg');
    }

    function resizeCanvas() {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
    }
    video.addEventListener('loadedmetadata', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);
  </script>
